version: v1.0
name: "\U0001F40D Django CI Pipeline (Docker)"
agent:
  machine:
    type: s1-kubernetes
    os_image: ''
  containers:
    - name: main
      image: 'python:3.8'
      user: root
    - name: mysql
      image: 'mysql:8.0'
      env_vars:
        - name: MYSQL_ROOT_PASSWORD
          value: root
        - name: MYSQL_DATABASE
          value: pydjango
        - name: MYSQL_ROOT_HOST
          value: '%'
fail_fast:
  stop:
    when: branch != 'master'
auto_cancel:
  running:
    when: branch != 'master'
  queued:
    when: branch = 'master'
global_job_config:
  prologue:
    commands:
      - checkout
      - pip install -r requirements.txt --cache-dir .pip_cache
      - cache restore
  env_vars:
    - name: DB_HOST
      value: mysql
    - name: DB_USER
      value: root
    - name: DB_PASSWORD
      value: root
    - name: DB_NAME
      value: pydjango
blocks:
  - name: "\U0001F6E0️ Install Dependencies"
    dependencies: []
    task:
      jobs:
        - name: "\U0001F4E6 Install Python Dependencies"
          commands:
            - rm -f /var/lib/apt/lists/lock
            - rm -f /var/cache/apt/archives/lock
            - rm -f /var/lib/dpkg/lock*
            - apt-get clean
            - apt-get update -y
            - apt-get install -y python3-dev
            - apt-get install -y default-libmysqlclient-dev
            - apt-get install -y default-mysql-client
            - pip download --cache-dir .pip_cache -r requirements.txt
            - pip install pylint pylint-django
            - cache store
  - name: "\U0001F50D Run Code Analysis"
    dependencies:
      - "\U0001F6E0️ Install Dependencies"
    task:
      jobs:
        - name: "\U0001F6E1️ Pylint Analysis"
          commands:
            - pylint $(git ls-files | grep -v 'migrations' | grep -v 'settings.py' | grep -v 'manage.py' | grep -E '.py$') -E --load-plugins=pylint_django
  - name: "\U0001F9EA Run Unit Tests"
    dependencies:
      - "\U0001F6E0️ Install Dependencies"
    task:
      jobs:
        - name: "\U0001F50E Test Models"
          commands:
            - python manage.py test tasks.tests.test_models
        - name: "\U0001F50E Test Views"
          commands:
            - python manage.py test tasks.tests.test_views
  - name: "\U0001F310 Run Browser Tests"
    dependencies:
      - "\U0001F9EA Run Unit Tests"
    task:
      prologue:
        commands:
          - apt-get update
          - apt-get install -y default-mysql-client
          - |
            # Wait for MySQL to be ready
            echo "Waiting for MySQL to be ready..."
            max_attempts=30
            counter=0
            while ! mysql --host=mysql -uroot -proot -e "SELECT 1" >/dev/null 2>&1
            do
              counter=$((counter+1))
              if [ $counter -gt $max_attempts ]; then
                echo "MySQL failed to start in time"
                exit 1
              fi
              echo "MySQL not ready yet. Waiting..."
              sleep 2
            done
            echo "MySQL is ready!"
      jobs:
        - name: "\U0001F3AD Browser Tests"
          commands:
            - mysql --host=mysql -uroot -proot -e "create database IF NOT EXISTS $DB_NAME"
            - 'nohup python manage.py runserver 0.0.0.0:8000 &'
            - sleep 5
            - python manage.py test tasks.tests.test_browser
  - name: "\U0001F510 Run Security Tests"
    dependencies: []
    task:
      jobs:
        - name: ✅ Deployment Checklist
          commands:
            - python manage.py check --deploy --fail-level ERROR
